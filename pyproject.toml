[project]
name = "ctswarm"
version = "0.1.0"
description = "Governance, routing, and evidence layer around SWE-AF"
# 3.11 is the real floor: `tomllib` is in the standard library from 3.11 and is
# imported unconditionally. The previous floor of 3.10 paired with a `tomli`
# fallback dependency that nothing imported, so a 3.10 install resolved happily
# and then failed at startup on `import tomllib`.
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
ctswarm = "ctswarm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ctswarm*"]

[tool.setuptools.package-data]
ctswarm = ["static/dashboard/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
