# ctswarm overlay for SWE-AF's compose stack.
#
# Composed alongside the vendored SWE-AF compose file. Paths here are relative to
# the REPO ROOT, which requires --project-directory:
#
#   docker compose --project-directory . \
#                  -f vendor/SWE-AF/docker-compose.yml \
#                  -f infra/docker-compose.ctswarm.yml up -d
#
# Without --project-directory, compose resolves relative paths against the first
# -f file's directory (vendor/SWE-AF/), silently pointing the build context and
# the opencode config at the wrong places. Use `./stack.sh` rather than typing
# this out.
#
# What this overlay adds:
#   - the ctswarm router, reachable by the SWE-AF agents as an OpenAI-compatible
#     endpoint, itself reaching host-local Ollama over the docker host gateway
#   - the approval service, which receives SWE-AF HITL escalations
#   - an opencode provider config mounted into the agents so `ctswarm/*` model
#     ids resolve to the router
#   - Claude subscription credentials mounted read-only alongside the Codex ones
#     SWE-AF already mounts
#
# Ollama itself is never published. The router reaches it through
# host.docker.internal, which is a docker-internal route, so port 11434 stays
# bound to loopback on the host as the plan requires.

x-ctswarm-logging: &ctswarm-logging
  driver: json-file
  options:
    max-size: "${CTSWARM_LOG_MAX_SIZE:-10m}"
    max-file: "${CTSWARM_LOG_MAX_FILES:-5}"

services:
  # SWE-AF publishes the control plane on host 8080, which collides with almost
  # anything else a developer runs (here: an existing Supabase stack). Remapped
  # to a high port and bound to loopback. Only the *host* mapping changes;
  # in-network callers still use control-plane:8080, so nothing else needs
  # rewiring.
  # `!override` is required, not stylistic: compose *merges* sequences across
  # overlay files, so a plain `ports:` here would append the new mapping while
  # keeping the base 8080 binding, and the collision would persist.
  control-plane:
    ports: !override
      - "127.0.0.1:${CTSWARM_CONTROL_PLANE_PORT:-18080}:8080"
    restart: unless-stopped
    logging: *ctswarm-logging

  build-db:
    restart: unless-stopped
    logging: *ctswarm-logging

  ctswarm-router:
    build:
      context: .
      dockerfile: infra/Dockerfile.router
    environment:
      # host-gateway resolves to the docker host from inside the network, so the
      # local inference server needs no public exposure.
      - CTSWARM_OLLAMA_HOST=${CTSWARM_OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
      - CTSWARM_OLLAMA_MODEL_ALLOWLIST=${CTSWARM_OLLAMA_MODEL_ALLOWLIST:-}
      # Hard ceiling for explicit native Ollama requests. This prevents a model's
      # advertised 128k/256k maximum from allocating tens of GiB of KV cache.
      - CTSWARM_OLLAMA_CONTEXT_CEILING=${CTSWARM_OLLAMA_CONTEXT_CEILING:-16384}
      - CTSWARM_MLX_HOST=${CTSWARM_MLX_HOST:-http://host.docker.internal:8081}
      - CTSWARM_LMSTUDIO_HOST=${CTSWARM_LMSTUDIO_HOST:-http://host.docker.internal:1234}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CTSWARM_DB=/state/ctswarm.db
      # Produced by `ctswarm bench` on the host and bind-mounted read-only.
      - CTSWARM_ROUTING=/bench-results/routing.json
      - CTSWARM_PREFER_LOCAL=${CTSWARM_PREFER_LOCAL:-1}
      # OpenCode is the worker harness. Hosted models are invoked directly by
      # Claude/Codex only for role-level planning and review overrides.
      - CTSWARM_ROUTER_LOCAL_ONLY=${CTSWARM_ROUTER_LOCAL_ONLY:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback-bound on purpose. The router must not be reachable off-host.
      - "127.0.0.1:8090:8090"
    volumes:
      - ctswarm-state:/state
      # The routing table is produced by `ctswarm bench` on the host and is an
      # input to the containerized router, so it is bind-mounted read-only.
      - ./bench/results:/bench-results:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health',timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *ctswarm-logging

  ctswarm-approvals:
    build:
      context: .
      dockerfile: infra/Dockerfile.router
    command:
      - uvicorn
      - ctswarm.approvals.service:app
      - --host
      - 0.0.0.0
      - --port
      - "8091"
    environment:
      - CTSWARM_DB=/state/ctswarm.db
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET:-}
      - SLACK_APPROVAL_CHANNEL=${SLACK_APPROVAL_CHANNEL:-}
      # Where the approval service tells SWE-AF to send decisions back.
      - AGENTFIELD_SERVER=http://control-plane:8080
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ctswarm-state:/state
    restart: unless-stopped
    logging: *ctswarm-logging

  ctswarm-scheduler:
    build:
      context: .
      dockerfile: infra/Dockerfile.router
    command:
      - uvicorn
      - ctswarm.scheduler:app
      - --host
      - 0.0.0.0
      - --port
      - "8092"
    environment:
      - CTSWARM_DB=/state/ctswarm.db
      - CTSWARM_AGENTFIELD_URL=http://control-plane:8080
      - CTSWARM_APPROVALS_URL=http://ctswarm-approvals:8091
      - CTSWARM_ROUTER_URL=http://ctswarm-router:8090
      - CTSWARM_ROUTING=/bench-results/routing.json
      - CTSWARM_PROJECTS_ROOT=${HOME}/Desktop/Projects
      - CTSWARM_PROJECT_SCAN_DEPTH=${CTSWARM_PROJECT_SCAN_DEPTH:-3}
      - CTSWARM_MCP_INVENTORY=/bench-results/mcp-inventory.json
      - CTSWARM_MAX_CONCURRENT_BUILDS=${CTSWARM_MAX_CONCURRENT_BUILDS:-1}
      - CTSWARM_SCHEDULER_POLL_SECONDS=${CTSWARM_SCHEDULER_POLL_SECONDS:-10}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SWE_CODEX_AUTH_MODE=${SWE_CODEX_AUTH_MODE:-auto}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_STATUS_CHANNEL=${SLACK_STATUS_CHANNEL:-}
      - SLACK_APPROVAL_CHANNEL=${SLACK_APPROVAL_CHANNEL:-}
    ports:
      - "127.0.0.1:8092:8092"
    volumes:
      - ctswarm-state:/state
      - ./bench/results:/bench-results:ro
      - ${HOME}/.codex:/home/ctswarm/.codex:ro
      # Repository inspection is read-only. Builds still clone into isolated
      # AgentField workspaces before making changes.
      - ${HOME}/Desktop/Projects:${HOME}/Desktop/Projects:ro
    depends_on:
      swe-agent:
        condition: service_healthy
      ctswarm-router:
        condition: service_healthy
      ctswarm-approvals:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8092/health',timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *ctswarm-logging

  # SWE-AF's own agent services, extended rather than redefined.
  swe-agent:
    # --project-directory relocates every relative path, including the ones in
    # SWE-AF's own compose file, so its `context: .` would resolve to the ctswarm
    # repo root and fail to find its Dockerfile. Restated here explicitly.
    build:
      context: ./vendor/SWE-AF
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - cp /root/.claude.json.seed /root/.claude.json && exec python -m swe_af
    environment:
      # Route every tier through ctswarm. These ids are simultaneously valid
      # opencode provider/model references and ctswarm virtual models, which is
      # what lets one string satisfy both systems.
      - SWE_DEFAULT_RUNTIME=${SWE_DEFAULT_RUNTIME:-open_code}
      - SWE_MODEL_HIGH=${SWE_MODEL_HIGH:-ctswarm/high}
      - SWE_MODEL_MED=${SWE_MODEL_MED:-ctswarm/med}
      - SWE_MODEL_LOW=${SWE_MODEL_LOW:-ctswarm/low}
      # Codex runs inside this isolated Docker worker and checkout. Its nested
      # bubblewrap namespaces are unavailable under Docker's security profile,
      # so the wrapper removes the inner sandbox while retaining container,
      # read-only credential, and read-only host-project boundaries.
      - CTSWARM_CODEX_DOCKER_BYPASS=1
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ctswarm's scheduler owns the per-build deadline (up to 72h) and sends a
      # cooperative cancel when it expires. Keep AgentField's process-local
      # watchdog just above that supported maximum so its historical 7200s
      # default cannot kill a healthy build before the scheduler does.
      - AGENTFIELD_ASYNC_DEFAULT_EXECUTION_TIMEOUT=${CTSWARM_AGENTFIELD_REASONER_TIMEOUT_SECONDS:-259500}
      - AGENTFIELD_ASYNC_MAX_EXECUTION_TIMEOUT=${CTSWARM_AGENTFIELD_REASONER_TIMEOUT_SECONDS:-259500}
      # Local reasoning models may spend more than five minutes between
      # OpenCode JSON events even while Ollama is actively generating.
      - AGENTFIELD_HARNESS_IDLE_SECONDS=${CTSWARM_OPENCODE_IDLE_SECONDS:-900}
      # This host serves one Qwen generation at a time. Queue at the harness
      # instead of launching workers that contend for the same inference slot.
      - OPENCODE_MAX_CONCURRENT=${CTSWARM_OPENCODE_MAX_CONCURRENT:-1}
      - AGENTFIELD_OPENCODE_REUSE_DATA_DIR=true
      - AGENT_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # opencode reads provider config from XDG config; mounting it here is what
      # makes `ctswarm/*` resolve to the router inside the agent container.
      - ./infra/opencode/opencode.json:/root/.config/opencode/opencode.json:ro
      # Mount only the Claude credential, not the entire host profile. The full
      # profile can contain thousands of skills and hundreds of MB of caches;
      # exposing it made every CLI invocation scan unrelated host state.
      - ${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      # Claude CLI updates its config during normal startup. Mount the operator
      # config as a read-only seed, then copy it to ephemeral container storage
      # in the command above so neither the CLI nor agents can mutate the host.
      - ${HOME}/.claude.json:/root/.claude.json.seed:ro
      - ${HOME}/.codex/config.toml:/root/.codex/config.toml:ro
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro
      - ${HOME}/Desktop/Projects:${HOME}/Desktop/Projects:ro
    depends_on:
      ctswarm-router:
        condition: service_healthy
    restart: unless-stopped
    logging: *ctswarm-logging

  swe-fast:
    build:
      context: ./vendor/SWE-AF
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - cp /root/.claude.json.seed /root/.claude.json && exec python -m swe_af.fast
    environment:
      - SWE_DEFAULT_RUNTIME=${SWE_DEFAULT_RUNTIME:-open_code}
      - SWE_MODEL_HIGH=${SWE_MODEL_HIGH:-ctswarm/high}
      - SWE_MODEL_MED=${SWE_MODEL_MED:-ctswarm/med}
      - SWE_MODEL_LOW=${SWE_MODEL_LOW:-ctswarm/low}
      - CTSWARM_CODEX_DOCKER_BYPASS=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/opencode/opencode.json:/root/.config/opencode/opencode.json:ro
      - ${HOME}/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      - ${HOME}/.claude.json:/root/.claude.json.seed:ro
      - ${HOME}/.codex/config.toml:/root/.codex/config.toml:ro
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro
      - ${HOME}/Desktop/Projects:${HOME}/Desktop/Projects:ro
    depends_on:
      ctswarm-router:
        condition: service_healthy
    restart: unless-stopped
    logging: *ctswarm-logging

volumes:
  ctswarm-state:
